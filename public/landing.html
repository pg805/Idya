<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy of Apolis</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/landing.css">
  <script>if (location.port === '3000') document.title += ' — Dev';</script>
</head>
<body>
  <main class="landing-main">

    <!-- ============================================================
         COPY: this whole block is yours to rewrite. It's the first
         thing a stranger reads. Everything below the brand block is
         mechanism and can stay as-is.
         ============================================================ -->
    <div class="landing-brand">
      <h1 class="landing-title">LEGACY OF APOLIS</h1>
      <p class="landing-tagline">A living world</p>
    </div>

    <!-- Shown when someone lands here after their session ended. -->
    <div class="landing-notice" id="expired-notice" hidden>
      Your session ended. Sign in again to pick up where you left off.
    </div>

    <!-- One action, whichever it is. Filled in below once we know the state. -->
    <div class="landing-actions" id="landing-actions" hidden>
      <a class="landing-btn" id="primary-btn" href="/signin">Sign in</a>
      <button class="landing-btn secondary" type="button" id="logout-btn" hidden>Sign out</button>
    </div>

  </main>

  <footer class="landing-foot">
    <a href="/app/about">About</a> · <a href="/app/lore">Lore</a> · <a href="/app/reference">Reference</a>
  </footer>

  <script src="/auth.js"></script>
  <script>
    (async function () {
      // Arriving with ?auth=TOKEN (a Discord deep link) signs you straight in.
      await claimAuthFromUrl();

      const params = new URLSearchParams(location.search);
      if (params.get('expired') === '1') {
        document.getElementById('expired-notice').hidden = false;
        history.replaceState(null, '', location.pathname);
      }

      // Three states, one button:
      //   signed out            -> sign in (which is also sign up, for now)
      //   signed in, no char    -> finish signing up
      //   signed in, has a char -> resume
      const me  = await idyaWhoAmI();
      const btn = document.getElementById('primary-btn');

      if (!me?.authenticated) {
        btn.textContent = 'Sign in';
        btn.href = '/signin';
      } else if (!me.characterName) {
        btn.textContent = 'Create your character';
        btn.href = '/app/create';
      } else {
        btn.textContent = `Continue as ${me.characterName}`;
        btn.href = '/app';
      }

      const logout = document.getElementById('logout-btn');
      logout.hidden = !me?.authenticated;
      logout.addEventListener('click', () => idyaLogout());

      document.getElementById('landing-actions').hidden = false;
    })();
  </script>
</body>
</html>
