<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy of Apolis</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/palette.css">
  <link rel="stylesheet" href="/landing.css">
  <script>if (location.port === '3000') document.title += ' — Dev';</script>
</head>
<body>
  <main class="landing-main">

    <!-- ============================================================
         COPY: this block is yours to rewrite. It's the first thing a
         stranger reads. Everything below it is mechanism.
         ============================================================ -->
    <div class="landing-brand">
      <h1 class="landing-title">LEGACY OF APOLIS</h1>
      <p class="landing-tagline">A living world</p>
    </div>

    <!-- Shown when someone lands here after their session ended. -->
    <div class="landing-notice" id="expired-notice" hidden>
      Your session ended. Sign in again to pick up where you left off.
    </div>

    <!-- This page is for signed-out visitors. A live session redirects to
         /app before any of this renders. -->
    <div class="landing-actions centered" id="landing-actions" hidden>
      <a class="landing-btn" href="/signin">Sign in</a>
      <a class="landing-btn secondary" href="/signup">Sign up</a>
    </div>

  </main>

  <footer class="landing-foot">
    <a href="/app/about">About</a> · <a href="/app/lore">Lore</a> · <a href="/app/reference">Reference</a>
  </footer>

  <script src="/auth.js"></script>
  <script>
    (async function () {
      // Arriving with ?auth=TOKEN (a Discord deep link) signs you straight in.
      await claimAuthFromUrl();

      const params = new URLSearchParams(location.search);
      if (params.get('expired') === '1') {
        document.getElementById('expired-notice').hidden = false;
        history.replaceState(null, '', location.pathname);
      }

      // If you're signed in, you don't want a landing page — you want the world.
      const me = await idyaWhoAmI();
      if (me?.authenticated) { location.replace('/app'); return; }

      document.getElementById('landing-actions').hidden = false;
    })();
  </script>
</body>
</html>
