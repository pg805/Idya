<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy of Apolis</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/landing.css">
  <script>if (location.port === '3000') document.title += ' — Dev';</script>
</head>
<body>
  <main class="landing-main">

    <!-- ============================================================
         COPY: this whole block is yours to rewrite. It's the first
         thing a stranger reads. Everything below the brand block is
         mechanism and can stay as-is.
         ============================================================ -->
    <div class="landing-brand">
      <h1 class="landing-title">LEGACY<br>OF APOLIS</h1>
      <p class="landing-tagline">A living world.</p>
    </div>

    <!-- Shown when someone lands here after their session ended. -->
    <div class="landing-notice" id="expired-notice" hidden>
      Your session ended. Sign in again to pick up where you left off.
    </div>

    <!-- Signed in: straight through. Signed out: to the sign-in page. -->
    <div class="landing-actions" id="landing-actions" hidden>
      <a class="landing-btn" id="enter-btn" href="/app" hidden>Enter</a>
      <a class="landing-btn" id="signin-btn" href="/signin" hidden>Sign in</a>
      <button class="landing-btn secondary" type="button" id="logout-btn" hidden>Sign out</button>
    </div>

    <p class="landing-blurb" id="signed-in-line" hidden></p>

  </main>

  <footer class="landing-foot">
    <a href="/app/about">About</a> · <a href="/app/lore">Lore</a> · <a href="/app/reference">Reference</a>
  </footer>

  <script src="/auth.js"></script>
  <script>
    (async function () {
      // Arriving with ?auth=TOKEN (a Discord deep link) signs you straight in.
      await claimAuthFromUrl();

      const params = new URLSearchParams(location.search);
      if (params.get('expired') === '1') {
        document.getElementById('expired-notice').hidden = false;
        history.replaceState(null, '', location.pathname);
      }

      const me = await idyaWhoAmI();
      const signedIn = !!me?.authenticated;

      document.getElementById('enter-btn').hidden   = !signedIn;
      document.getElementById('logout-btn').hidden  = !signedIn;
      document.getElementById('signin-btn').hidden  = signedIn;
      document.getElementById('landing-actions').hidden = false;

      if (signedIn && me.characterName) {
        const line = document.getElementById('signed-in-line');
        line.textContent = `Signed in as ${me.characterName}.`;
        line.hidden = false;
      }

      document.getElementById('logout-btn').addEventListener('click', () => idyaLogout());
    })();
  </script>
</body>
</html>
